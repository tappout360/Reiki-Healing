<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d12" />
    <meta name="description" content="Reiki & Sage — A spiritual wellness sanctuary for guided healing protocols, energy alignment, and personal growth." />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Reiki & Sage — Healing Sanctuary</title>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script>
      (function() {
        const gaId = typeof process !== 'undefined' && process.env && process.env.VITE_GA_MEASUREMENT_ID 
          ? process.env.VITE_GA_MEASUREMENT_ID 
          : null;
        if (gaId && gaId.startsWith('G-')) {
          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', gaId, { 'anonymize_ip': true });
          window.gtag = gtag;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Capture the beforeinstallprompt event globally before React loads
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        if (typeof window.onBeforeInstallPrompt === 'function') {
          window.onBeforeInstallPrompt(e);
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('ServiceWorker registered:', reg))
            .catch(err => console.log('ServiceWorker registration failed:', err));
        });

        // Force page reload on service worker controller change to ensure users get the new version instantly
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
